<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xautoposter · 改善ループ</title><link rel="stylesheet" href="/static/learning.css"><script src="/static/learning.js" defer></script></head><body>
<header><a href="/learning">Xautoposter</a><nav><a href="/research">投稿の作成・分析・接続設定</a></nav></header>
<main><p class="eyebrow">POST → LEARN → NEXT</p><h1>投稿の反応から、次の一文へ。</h1><p>公開した投稿を選ぶだけ。反応を確認して、次に試す投稿文をAIが提案します。</p>
<section class="status"><span id="runtime">接続を確認中…</span><button id="refresh" type="button">更新</button></section>
<p id="error" role="alert" hidden></p><div id="entries"></div>
<section class="note"><h2>使い方は3つだけ</h2><div class="steps"><p><b>1</b> 公開した投稿を登録</p><p><b>2</b> 反応をチェック</p><p><b>3</b> 次の投稿案を作る</p></div><details><summary>このアプリが自動で行わないこと</summary><p>投稿、返信、DMは自動実行しません。AIが作った文章も、あなたが選ぶまで下書きへ反映しません。</p><p>反応の確認にはAPIを利用します。アプリの停止・スリープ中は確認されません。</p></details></section>
</main></body></html>
